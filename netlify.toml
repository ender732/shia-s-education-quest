# TanStack Start on Netlify:
# https://docs.netlify.com/build/frameworks/framework-setup-guides/tanstack-start/
#
# If Site settings → Build & deploy → Continuous deployment still has a
# Publish directory set in the UI (publishOrigin: ui), clear it or set it
# to dist/client so these [build] values are authoritative.
[build]
  command = "npm run build"
  publish = "dist/client"

# Publishable Supabase client keys (VITE_*) are safe in browser bundles.
# EMAIL_FROM / RESEND_FROM and GEMINI_MODEL / AI_MODEL are not secrets but are
# often marked secret in the UI; their values also appear in source/build
# (e.g. default model "gemini-2.0-flash"), which trips secrets scanning.
# Omit them so deploys succeed. Do NOT omit GEMINI_API_KEY or RESEND_API_KEY.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_PUBLISHABLE_KEY,VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_PROJECT_ID,SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,SUPABASE_PROJECT_ID,EMAIL_FROM,RESEND_FROM,GEMINI_MODEL,AI_MODEL"

# Force clients/CDNs to revalidate the favicon (old Lovable icon was sticky).
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# App-wide security headers (OWASP A05 / NIST SC-*, SI-*)
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://*.supabase.co; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://accounts.google.com; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com https://*.supabase.co; worker-src 'self' blob:; upgrade-insecure-requests"
